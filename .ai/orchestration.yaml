# .ai/orchestration.yaml — project contract for the sequential coding team (ADR-0005)
# Read by scripts/orchestrate.py. The orchestrator agent reads it too, but never edits it during a run.
version: 1

execution:
  mode: sequential            # the only supported mode
  max_concurrent_agents: 1    # enforced by .ai/runs/.lock
  # shared_lock: ~/.local/state/vibecoding/model.lock   # also taken when set: one coding agent per model
  #                                                      # across repos sharing it (ADR-0010 DEC-008)

git:
  base_branch: main
  branch_prefix: agent/       # 1 task = 1 branch = 1 worktree: agent/TASK-0042
  worktrees_dir: ../.worktrees/{repo}
  require_clean_tree_after_dev: true
  # Human-owned files: a task diff touching them is sent back to DEV (ADR-0005, ADR-0007, ADR-0008).
  # orchestrate.py always adds the autonomy policy's own list (.ai/autonomy.yaml included).
  protected_paths: [.claude/, .ai/autonomy.yaml, .ai/orchestration.yaml, .ai/roles/, scripts/orchestrate.py]
  # DEV never pushes, merges or rebases. Pushing the task branch / opening the PR / merging after
  # human approval depend on the autonomy level in .ai/autonomy.yaml (ADR-0008).

limits:
  max_review_cycles: 3        # CHANGES_REQUESTED loops before BLOCKED
  max_test_cycles: 3          # FAIL loops before BLOCKED
  max_dev_runs: 6             # hard ceiling on DEV invocations per task
  agent_result_parse_retries: 1
  # Autonomy `yolo` only (ADR-0009): CI of the task PR.
  max_ci_cycles: 3            # red-CI loops back to DEV before BLOCKED
  ci_timeout_sec: 1800        # longest wait for the PR's checks
  ci_poll_sec: 20
  ci_no_checks_grace_sec: 90  # no check after this long = the repo has no CI: merge

validation:
  # Project-wide commands, executed by the orchestrator (not by an LLM) before TEST.
  # Tasks can add their own under `validations:` in their front matter.
  log_tail_lines: 200
  commands:
    - name: lint
      run: "echo 'configure your lint command in .ai/orchestration.yaml'"
      timeout_sec: 600
    - name: unit-tests
      run: "echo 'configure your test command in .ai/orchestration.yaml'"
      timeout_sec: 1800
    # autonomy-check (rendered guard rails match .ai/autonomy.yaml) is built in and always runs first.
    - name: secrets-scan        # deterministic, independent of hooks (ADR-0005)
      run: 'python3 .claude/hooks/secrets_scanner.py --range "$ORCHESTRATE_BASE_SHA..HEAD"'
      timeout_sec: 120

# One vLLM model (Qwen-3.8-27B-NVFP4 on DGX Spark), one gateway per role.
# Temperature and the output cap are ENFORCED BY THE GATEWAY: Claude Code does not expose
# temperature. The values below are what orchestrate.py uses for context budgeting and for
# CLAUDE_CODE_MAX_OUTPUT_TOKENS. Keep them identical to dev-factory/gateways.yaml.
gateways:
  cc-dev:
    base_url: http://dgx-spark.local:4001
    model: qwen3.8-27b-nvfp4
    api_key_env: CC_DEV_GATEWAY_KEY
    context_tokens: 98000
    max_output_tokens: 4000
    temperature: 0.2
  cc-review:
    base_url: http://dgx-spark.local:4002
    model: qwen3.8-27b-nvfp4
    api_key_env: CC_REVIEW_GATEWAY_KEY
    context_tokens: 32000
    max_output_tokens: 2000
    temperature: 0.1
  oh-dev:                     # OpenHands DEV (ADR-0010): OpenAI-compatible route, LiteLLM model slug
    api: openai
    base_url: http://dgx-spark.local:4004/v1
    model: openai/qwen3.8-27b-nvfp4
    api_key_env: OH_DEV_GATEWAY_KEY
    context_tokens: 98000
    max_output_tokens: 8000
    temperature: 0.2
  cc-test:
    base_url: http://dgx-spark.local:4003
    model: qwen3.8-27b-nvfp4
    api_key_env: CC_TEST_GATEWAY_KEY
    context_tokens: 32000
    max_output_tokens: 2000
    temperature: 0.1

agents:
  dev:
    gateway: cc-dev
    role_prompt: .ai/roles/dev.md
    tools: [Read, Edit, Write, Glob, Grep, Bash]
    timeout_sec: 5400
    # DEV runs WITHOUT --bare so that the PreToolUse hooks (tool_guardian, secrets_scanner) run.
    # Only the project's settings are loaded (the worktree's .claude/settings.json), not the
    # user's. The files below must be committed on the base branch; otherwise the run is
    # BLOCKED instead of running unguarded.
    extra_args: [--setting-sources, project]
    required_files: [.claude/settings.json, .claude/hooks/tool_guardian.py, .claude/hooks/secrets_scanner.py, .claude/hooks/autonomy.py]
    # Estimated tokens consumed by Claude Code's own system prompt + tool schemas + CLAUDE.md.
    # Calibrate: run one task and read the "usage" lines in .ai/runs/<task>/timeline.log.
    overhead_tokens: 20000
    # Other DEV executors (ADR-0010). A task picks one with `executor:`; the repo must allow it in
    # .ai/autonomy.yaml (`executors:`). Run them only in an isolated runner (adapters/openhands/README.md).
    executors:
      openhands:
        gateway: oh-dev
        role_prompt: .ai/roles/dev-openhands.md
        timeout_sec: 14400        # long sessions: 4 h
        command: [openhands, --headless, --json, --override-with-envs, --exit-without-confirmation, -f, "{work_order_file}"]
  review:
    gateway: cc-review
    role_prompt: .ai/roles/review.md
    tools: [Read, Glob, Grep]
    timeout_sec: 1200
    overhead_tokens: 12000
    extra_args: [--bare, --settings, "{settings_file}"]   # read-only role: no hooks needed
  test:
    gateway: cc-test
    role_prompt: .ai/roles/test.md
    tools: [Read, Glob, Grep]
    timeout_sec: 1200
    overhead_tokens: 12000
    extra_args: [--bare, --settings, "{settings_file}"]

runner:
  # Claude Code headless invocation, common to all roles; per-role flags in agents.<role>.extra_args.
  # Never put --bare here: it skips hooks, and DEV must run with them. REVIEW/TEST add --bare in
  # their extra_args (skips CLAUDE.md auto-discovery, hooks, auto-memory and prefetches: essential
  # to fit 32k) and get the deny rules through --settings; they only have read tools.
  # DEV keeps hooks and deny rules from the worktree's .claude/settings.json.
  # prefix: [run-as-agent]   # prepended to every agent command (all roles, all executors) and to every
  #                          # validation command: the runner's wrapper that drops to the unprivileged
  #                          # agent user (ADR-0010 DEC-004). A runner may impose it instead through the
  #                          # ORCHESTRATE_RUNNER_PREFIX environment variable, which takes precedence.
  output_format: claude-json
  settings_file: .claude/settings.json
  disallowed_tools: [Task, Agent]   # no sub-agents: stay sequential. WebFetch/WebSearch are added
                                    # by orchestrate.py at autonomy level `supervised` (ADR-0008).
  command:
    - claude
    - -p
    - "{instruction}"
    - --output-format
    - json
    - --no-session-persistence
    - --append-system-prompt-file
    - "{role_prompt_file}"
    - --model
    - "{model}"
    - --tools
    - "{tools}"
    - --allowedTools
    - "{tools}"
    - --disallowedTools
    - "{disallowed_tools}"
